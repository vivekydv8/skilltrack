version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skilltrack_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: skilltrackai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skilltrackai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skilltrack_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/skilltrackai
      - SECRET_KEY=sih26135-maharashtra-skilltrack-secret-key-2026
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_URL=http://localhost:5173
      # Twilio configuration: optional
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skilltrack_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
